<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)"/>
  
  <!-- Code Brackets -->
  <g fill="white" font-family="Consolas, monospace" font-weight="bold">
    <!-- Left Bracket < -->
    <path d="M30 50 L45 35 L48 38 L36 50 L48 62 L45 65 Z" fill="white"/>
    
    <!-- Right Bracket > -->
    <path d="M70 50 L55 35 L52 38 L64 50 L52 62 L55 65 Z" fill="white"/>
    
    <!-- Slash / -->
    <rect x="46" y="30" width="8" height="40" rx="2" fill="white" transform="rotate(15 50 50)"/>
  </g>
</svg>
